# Safety net: whenever posts or settings change outside the Windows publisher
# (edited on github.com, pushed by another machine), regenerate the public
# manifest content/index.json so the static site stays in sync.
#
# The Windows publisher (publisher/) updates index.json itself on every push,
# so this workflow usually finds nothing to do and commits nothing.
name: rebuild-index

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
      - 'content/settings.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - name: Commit if changed
        run: |
          git config user.name  "cyanote-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/index.json
          if git diff --cached --quiet; then
            echo "index.json 已是最新，无需提交"
          else
            git commit -m "chore: rebuild content/index.json [skip ci]"
            git push
          fi
