  <title>Cyanote — 蓝色的思想笔记</title>
  <script>
    /* set theme before first paint — prevents white flash on load.
       Default = whatever the browser / OS asks for; a stored value only exists
       once the reader picked a theme on the toggle. */
    (function () {
      var d = document.documentElement;
      var prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      try {
        var t = localStorage.getItem('cyanote-theme');
        d.dataset.theme = t === 'dark' || t === 'light' ? t : prefersDark ? 'dark' : 'light';
      } catch (e) {
        d.dataset.theme = prefersDark ? 'dark' : 'light';
      }

      /* arm the opening ripple: first home visit of this session, or ?splash=1 */
      try {
        var hash = location.hash;
        var onHome = !hash || hash === '#' || hash === '#/' || hash === '#/?';
        var forced = /(?:^|[?&])splash=1/.test(location.search);
        var seen = false;
        try {
          seen = sessionStorage.getItem('cyanote-splash') === '1';
        } catch (e) {}
        if (onHome && (forced || !seen)) {
          d.classList.add('splash-pending');
          try {
            sessionStorage.setItem('cyanote-splash', '1');
          } catch (e) {}
          /* escape hatch: if the module never runs, never trap the reader */
          setTimeout(function () {
            d.classList.remove('splash-pending');
          }, 4000);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Cyanote — Hexo 风格的阅读体验，语雀式的写作体验，全局蓝色。" />
